name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: minicoder
          POSTGRES_PASSWORD: minicoder
          POSTGRES_DB: minicoder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minicoder -d minicoder_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MINICODER_TEST_DATABASE_URL: postgres://minicoder:minicoder@127.0.0.1:5432/minicoder_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release source
        run: make check
      - name: Package release binaries
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" dist/"$RELEASE_TAG"/*
          --verify-tag --generate-notes --title "$RELEASE_TAG"
