services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: minicoder
      POSTGRES_PASSWORD: minicoder
      POSTGRES_DB: minicoder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicoder -d minicoder"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
